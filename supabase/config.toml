# Boltpay — Supabase CLI / GitHub integration config
#
# Without this file the GitHub integration reports "No functions to deploy"
# even though supabase/functions/ has several of them, because it has nothing
# telling it they exist.
#
# The verify_jwt values below are NOT optional. The default is true, and
# some of these functions are called by clients that cannot present a
# Supabase JWT:
#
#   daily-report,
#   ledger-backup   — called by pg_cron with an x-cron-secret header.
#                     Both fail closed if CRON_SECRET is unset.
#
# user-withdraw is always called by a signed-in creator, so it keeps JWT
# verification ON.
#
# If you ever let the integration deploy functions WITHOUT this file, all
# they all get verify_jwt = true and every payment on the site starts failing
# with 401.

project_id = "ohwzmxwsphsfzudmlins"

[functions.user-withdraw]
verify_jwt = true

[functions.daily-report]
verify_jwt = false

[functions.ledger-backup]
verify_jwt = false

# Health monitor. Called by pg_cron, and optionally by an external uptime
# monitor pointed at the same URL with the same header. Returns 503 when
# something is wrong so a monitor can page on the status code alone.
[functions.health]
verify_jwt = false

# Social-media crawlers cannot present a JWT, and this endpoint only ever
# returns a picture built from a public display name.
[functions.og-image]
verify_jwt = false

# LND checkout (flag-gated by app_settings.lnd_checkout_enabled, default off).
# lnd-create-invoice / payment-status: called by anonymous payers through
# the Worker proxy. lnd-watcher: pg_cron with
# x-cron-secret, fails closed if CRON_SECRET is unset.
[functions.lnd-create-invoice]
verify_jwt = false

[functions.payment-status]
verify_jwt = false

[functions.lnd-watcher]
verify_jwt = false

[functions.track-event]
verify_jwt = false

# telegram-webhook: called by Telegram; checks X-Telegram-Bot-Api-Secret-Token itself.
[functions.telegram-webhook]
verify_jwt = false

# telegram-admin: admin-only bot status / resync / test. JWT required.
[functions.telegram-admin]
verify_jwt = true

# Admin-only payment and withdrawal actions; checks the admin JWT.
[functions.admin-actions]
verify_jwt = true
