name = "boltpay-og-preview"
main = "og-preview-worker.js"
compatibility_date = "2025-01-01"

# One [[routes]] block per domain. Payment links are root-level (/emma),
# so the pattern must be /* — NOT /u/*, which was the old broken pattern.
#
# Add a new block for every domain you attach in Cloudflare. The worker
# code itself needs no changes — it reads the domain from the request.

[[routes]]
pattern = "pay.parvez.website/*"
zone_name = "parvez.website"

# Example for additional domains — uncomment and edit as you add them:
#
# [[routes]]
# pattern = "boltpay.io/*"
# zone_name = "boltpay.io"
#
# [[routes]]
# pattern = "pay.bolt.io/*"
# zone_name = "bolt.io"

# If you deploy through the Cloudflare dashboard instead of wrangler CLI,
# add each route manually under Worker → Settings → Triggers → Add route.
