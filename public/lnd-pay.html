<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pay with Lightning</title>
<!-- Served by the Worker for /pay/<slug> and /pay/i/<paymentId>.
     Per-customer URLs: never indexed, never leak via Referer. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: #000; color: #fff; }
body { display: flex; justify-content: center; }
main { width: 100%; max-width: 430px; padding: 20px; }
.view { display: none; flex-direction: column; gap: 14px; }
.view.on { display: flex; }
.brand { font-size: 13px; color: rgba(255,255,255,.55); font-weight: 600; letter-spacing: .3px; }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
.sub { color: rgba(255,255,255,.7); font-size: 15px; }
.amount-row { display: flex; align-items: center; background: rgba(255,255,255,.08); border-radius: 16px; padding: 14px 18px; font-size: 34px; font-weight: 800; }
.amount-row input { background: none; border: 0; color: #fff; font: inherit; width: 100%; outline: none; margin-left: 4px; }
.btn { border: 0; border-radius: 999px; padding: 16px; font: 700 16px 'DM Sans', sans-serif; cursor: pointer; text-align: center; text-decoration: none; display: block; }
.btn.primary { background: #FFB800; color: #000; }
.btn.ghost { background: rgba(255,255,255,.1); color: #fff; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.quick button { flex: 1 1 28%; border: 0; border-radius: 12px; padding: 12px; background: rgba(255,255,255,.1); color: #fff; font: 700 15px 'DM Sans', sans-serif; cursor: pointer; }
.note { opacity: .8; font-size: 14px; margin: 4px 0 8px; white-space: pre-wrap; }
.btn:disabled { opacity: .5; cursor: default; }
.err { color: #ff6b60; font-size: 14px; min-height: 18px; }
#qr { background: #fff; padding: 12px; border-radius: 16px; align-self: center; }
.pill { align-self: center; background: rgba(255,255,255,.08); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill.urgent { background: rgba(255,69,58,.18); color: #ff6b60; }
.meta { text-align: center; color: rgba(255,255,255,.7); font-size: 14px; }
.addr { word-break: break-all; font-size: 12px; color: rgba(255,255,255,.6); text-align: center; }
.big { font-size: 64px; text-align: center; }
.center { text-align: center; }
</style>
</head>
<body>
<main>
  <div class="brand" id="brand"></div>

  <!-- 1. Amount -->
  <section class="view" id="v-amount">
    <h1 id="payee">Pay</h1>
    <p class="note" id="note" style="display:none"></p>
    <p class="sub" id="limits">Enter an amount</p>
    <div class="quick" id="quick"></div>
    <label class="amount-row">$<input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" oninput="onAmount()"></label>
    <div class="err" id="amount-err"></div>
    <button class="btn primary" id="continue" onclick="createInvoice()" disabled>Continue</button>
  </section>

  <!-- 2. Invoice -->
  <section class="view" id="v-invoice">
    <h1>Scan or tap to pay</h1>
    <div class="pill" id="timer">--:--</div>
    <div id="qr"></div>
    <p class="meta" id="inv-amount"></p>
    <a class="btn primary" id="cashapp" href="#" rel="noopener" onclick="payClick()">Open in Cash App</a>
    <button class="btn ghost" id="copy" onclick="copyInvoice()">Copy Lightning invoice</button>
    <div id="btc-box" style="display:none">
      <p class="meta">Or send on-chain Bitcoin to:</p>
      <p class="addr" id="btc-addr"></p>
    </div>
    <p class="meta">Waiting for payment… this page updates automatically.</p>
  </section>

  <!-- 3. Paid -->
  <section class="view" id="v-paid">
    <div class="big">✓</div>
    <h1 class="center">Payment received</h1>
    <p class="meta" id="paid-amount"></p>
    <p class="meta" id="paid-at"></p>
  </section>

  <!-- 4. Expired / error -->
  <section class="view" id="v-expired">
    <div class="big">⏱</div>
    <h1 class="center" id="exp-title">Invoice expired</h1>
    <p class="meta" id="exp-msg">This invoice is no longer payable. No money was taken.</p>
    <a class="btn ghost" id="retry" href="/">Start again</a>
  </section>
</main>

<script>
// Lightning checkout. Talks only to same-origin /api/lnd/* (the Worker
// proxies to Supabase), so the CSP connect-src 'self' covers it.
const el = (id) => document.getElementById(id);
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const SLUG = /^[A-Za-z0-9][A-Za-z0-9-]{2,48}[A-Za-z0-9]$/;
let slug = null, paymentId = null, limits = { min: 10, max: 1000 };
let bolt11 = null, expiresAt = null, pollTimer = null, tickTimer = null;

function deviceId() {
  try {
    let d = localStorage.getItem('pay_device');
    if (!d) { d = crypto.randomUUID(); localStorage.setItem('pay_device', d); }
    return d;
  } catch (e) { return null; }
}

function show(view) {
  for (const v of ['v-amount', 'v-invoice', 'v-paid', 'v-expired']) el(v).classList.toggle('on', v === view);
}

function fail(title, msg) {
  el('exp-title').textContent = title;
  el('exp-msg').textContent = msg;
  show('v-expired');
}

function money(n) { return '$' + Number(n).toFixed(2); }

function track(event) {
  if (!paymentId) return;
  const body = JSON.stringify({ paymentId: paymentId, event: event, deviceId: deviceId() });
  try {
    if (navigator.sendBeacon) navigator.sendBeacon('/api/lnd/event', new Blob([body], { type: 'application/json' }));
    else fetch('/api/lnd/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true });
  } catch (e) { /* analytics never blocks payment */ }
}

async function api(path, init) {
  const res = await fetch(path, init);
  let j = null;
  try { j = await res.json(); } catch (e) { /* empty */ }
  if (!res.ok) throw new Error((j && j.error && j.error.message) || 'Something went wrong');
  return j.data;
}

function parseAmount() {
  const v = el('amount').value.trim();
  if (!/^\d+(\.\d{1,2})?$/.test(v)) return null;
  return Number(v);
}

function onAmount() {
  const a = parseAmount();
  let msg = '';
  if (el('amount').value.trim() && a === null) msg = 'Enter a valid amount';
  else if (a !== null && (a < limits.min || a > limits.max)) msg = 'Amount must be between ' + money(limits.min) + ' and ' + money(limits.max);
  el('amount-err').textContent = msg;
  el('continue').disabled = a === null || !!msg;
}

async function loadLink() {
  try {
    const d = await api('/api/lnd/link?slug=' + encodeURIComponent(slug));
    limits = { min: d.minUsd, max: d.maxUsd };
    el('payee').textContent = 'Pay ' + d.displayName;
    el('limits').textContent = money(limits.min) + ' – ' + money(limits.max);
    if (d.note) { el('note').textContent = d.note; el('note').style.display = ''; }
    el('quick').innerHTML = '';
    // Links without their own quick amounts get sensible defaults inside
    // the link's min/max, so the payer always has one-tap choices.
    let quick = (d.quickAmounts || []).slice();
    if (!quick.length) quick = [10, 25, 50, 100, 250, 500].filter(function (q) { return q >= limits.min && q <= limits.max; }).slice(0, 4);
    quick.forEach(function (q) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = money(q);
      b.onclick = function () { el('amount').value = String(q); onAmount(); };
      el('quick').appendChild(b);
    });
    document.title = 'Pay ' + d.displayName;
    show('v-amount');
    el('amount').focus();
  } catch (e) {
    fail('Link unavailable', e.message);
  }
}

async function createInvoice() {
  const a = parseAmount();
  if (a === null) return;
  el('continue').disabled = true;
  el('continue').textContent = 'Creating invoice…';
  try {
    const d = await api('/api/lnd/invoice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug: slug, amountUSD: a, deviceId: deviceId() }),
    });
    paymentId = d.paymentId;
    history.replaceState(null, '', '/pay/i/' + paymentId);
    await openInvoice();
  } catch (e) {
    el('amount-err').textContent = e.message;
    el('continue').textContent = 'Continue';
    el('continue').disabled = false;
  }
}

function render(d) {
  if (d.status === 'paid') {
    stop();
    el('paid-amount').textContent = money(d.amountUSD) + ' paid';
    el('paid-at').textContent = d.paidAt ? new Date(d.paidAt).toLocaleString() : '';
    if (location.pathname.indexOf('/success') < 0) history.replaceState(null, '', '/pay/i/' + paymentId + '/success');
    track('paid-observed');
    show('v-paid');
    return;
  }
  if (d.status !== 'pending') {
    stop();
    if (location.pathname.indexOf('/expired') < 0) history.replaceState(null, '', '/pay/i/' + paymentId + '/expired');
    fail('Invoice expired', 'This invoice is no longer payable. No money was taken.');
    return;
  }
  expiresAt = d.expiresAt ? new Date(d.expiresAt).getTime() : null;
  if (d.bolt11 && d.bolt11 !== bolt11) {
    bolt11 = d.bolt11;
    el('qr').innerHTML = '';
    new QRCode(el('qr'), { text: 'lightning:' + bolt11.toUpperCase(), width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L });
    el('cashapp').href = 'https://cash.app/launch/lightning/' + encodeURIComponent(bolt11);
  }
  el('inv-amount').textContent = money(d.amountUSD) + (d.amountSats ? ' · ' + Number(d.amountSats).toLocaleString() + ' sats' : '');
  if (d.btcAddress) { el('btc-addr').textContent = d.btcAddress; el('btc-box').style.display = 'block'; }
  show('v-invoice');
}

function stop() { clearInterval(pollTimer); clearInterval(tickTimer); pollTimer = tickTimer = null; }

function tick() {
  if (!expiresAt) return;
  const s = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
  el('timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  el('timer').classList.toggle('urgent', s < 120);
}

async function poll() {
  try {
    render(await api('/api/lnd/status?id=' + encodeURIComponent(paymentId)));
  } catch (e) { /* transient; keep polling */ }
}

async function openInvoice() {
  try {
    render(await api('/api/lnd/status?id=' + encodeURIComponent(paymentId)));
  } catch (e) {
    fail('Invoice not found', e.message);
    return;
  }
  if (el('v-invoice').classList.contains('on')) {
    track('view');
    tick();
    tickTimer = setInterval(tick, 1000);
    pollTimer = setInterval(poll, 3000);
  }
}

function payClick() { track('pay-click'); }

async function copyInvoice() {
  if (!bolt11) return;
  try { await navigator.clipboard.writeText(bolt11); el('copy').textContent = 'Copied'; }
  catch (e) { el('copy').textContent = 'Copy failed'; }
  setTimeout(function () { el('copy').textContent = 'Copy Lightning invoice'; }, 1500);
}

document.addEventListener('visibilitychange', function () {
  if (!document.hidden && pollTimer) poll();
});

(function boot() {
  el('brand').textContent = location.hostname;
  const parts = location.pathname.replace(/^\/+|\/+$/g, '').split('/');
  if (parts[0] === 'pay' && parts[1] === 'i' && UUID.test(parts[2] || '')) {
    paymentId = parts[2];
    openInvoice();
  } else if (parts[0] === 'pay' && SLUG.test(parts[1] || '') && parts.length === 2) {
    slug = parts[1];
    el('retry').href = '/pay/' + slug;
    loadLink();
  } else {
    fail('Link not found', 'Check the link and try again.');
  }
})();
</script>
</body>
</html>
