<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · পেজ পাওয়া যায়নি — Boltpay</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/auth.css">
<script>
// Legacy BTCPay links were /<slug>. Send them to the Lightning pay page,
// which shows its own "Link not found" when the slug does not exist.
// Kept in sync with validate_link_slug() and worker/og-preview-worker.js.
const RESERVED = ['index','login','register','dashboard','admin','404','config','theme',
  'assets','favicon','invoice-boltpay-v2','api','u','static','public',
  'well-known','robots','sitemap','moderator'];
(function(){
  var s = location.pathname.replace(/^\/|\/$/g, '');
  if (/^[A-Za-z0-9_-]{2,64}$/.test(s) && RESERVED.indexOf(s.toLowerCase()) < 0) location.replace('/pay/' + encodeURIComponent(s) + location.search);
})();
</script>
</head>
<body>
<main class="shell"><div class="panel" style="max-width:420px;margin:15vh auto;text-align:center">
  <h1 data-en="Page not found" data-bn="পেজ পাওয়া যায়নি">Page not found</h1>
  <p data-en="Check the link and try again." data-bn="লিংকটি চেক করে আবার চেষ্টা করুন।">Check the link and try again.</p>
  <a class="btn-primary" href="/" data-en="Go home" data-bn="হোমে যান">Go home</a>
</div></main>
<script src="/auth.js"></script>
</body>
</html>
